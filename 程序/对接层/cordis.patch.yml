# 工具箱 · 对接层的挂载声明。
#
# 装法（本机开发用 link；<仓库> 与 <profile> 换成你自己的）：
#   dsh plugin --profile <profile> add link:<仓库>\对接层
#
# `项目根` 是唯一一个位置。七个模块与主 AI 模块都在它下面，配置里只给这一个。
# 段里的 !!js 表达式在 profile 载入时求值，能拿到的是全局对象与 loader 上下文（`ctx`）；
# 那里没有 require，所以正文这类内容一律写在文件里，不做读盘。

# ── 让开位置：harness 自带的身份与它自己那两段口吻 ──────────────────────────
- id: system-prompt
  config:
    # 身份正文由世界书条目提供。
    includeHarnessIdentity: false
    # 不放环境事实：AI 没有能用到它们的手段，写进去还会每轮都变。
    personaPrefix: ''
    personaSuffix: ''

# ── 计划模式：机制是 DSH 的，那段正文是我们的（可改的一段文字） ──────────────
- id: plan-mode
  config:
    section: |
      你在计划模式里。这个模式只有一条规矩：**先给方案，等人点头，再动手。**

      ## 一次往返长这样

      1. **先说你要做什么**，一两句话：改成什么、动哪个地方、大概几步。不要贴整段代码或整段提示词，除非用户就是要看那个。
      2. **然后停下来等。** 这一步不许调工具，不许"顺便先做一半"。
      3. 用户点头 → 动手。用户提了意见 → 只按他说的改方案，再等一次。
      4. **交完东西主动问一句满不满意。** 不满意就只改他指出来的那部分，别的别动。

      ## 别做的

      - 别在没批准的情况下连着做几轮。
      - 别把"我打算这样做"写成"我已经这样做了"。
      - 方案里别夹带用户没要的改动。想要，就在方案里单独提一句，等他一起批。

      ## 交方案时的形状

      ```
      要做什么：一句话
      打算怎么改：三两行
      会动到什么：文件 / 条目 / 参数
      不确定的：有什么你拿不准、要用户定的
      ```

# ── 我们自己这一层 ──────────────────────────────────────────────────────────
- insert:
    - id: toolbox
      name: dsh-toolbox
      config:
        项目根: '<仓库绝对路径>'
        # 内置预设与世界书相对于程序目录；个人数据位置由位置设置提供。
        默认目录: '主AI模块/assets/预设'
        世界书默认目录: '世界书模块/assets/世界书'
        # 模型位于启动入口同层的模型/识图和模型/翻译，选择存于个人设置。
        翻译方向: 'auto'
        # 哪台 ComfyUI（只有装配层能填地址；工具参数里没有它）
        comfyUI地址: 'http://127.0.0.1:8188'
        # 这次的请求叫什么。预设按它查"启用了哪几套"，世界书按它查命中。
        请求: 主AI
        # 装订模块的 AI 翻译走哪个请求（空 = 跟随主 AI）
        装订请求: 翻译
        # API 池：一条一行。**地址与密钥只在 DSH 那边配**，池里只留路由名。
        池:
          官方: { 路由: deepseek-official, 模型: [deepseek-flash] }
          本地: { 路由: local, 模型: [qwen-vl] }
        # 路由表：哪个请求走池里的哪一条 + 哪个模型。空 = 跟随主 AI。
        路由:
          主AI: {}
          翻译: {}
          识图: { 走: 本地, 模型: qwen-vl }
          文生图: {}
